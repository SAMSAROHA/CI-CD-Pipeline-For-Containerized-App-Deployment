  <g font-family="Segoe Print,Comic Sans MS,cursive">
    <text x="94" y="294" fill="#a2664d" font-size="15">PR → build + test, then stop here</text>
    <path d="M94 301C179 305 280 299 422 302" fill="none" stroke="#a2664d" stroke-width="1.5" stroke-linecap="round"/>
    <text x="94" y="337" fill="#303a3a" font-size="14">main push → publish SHA image + checks</text>
    <text x="94" y="366" fill="#303a3a" font-size="14">deploy stays off until a person ticks the box</text>
    <text x="764" y="300" fill="#4d7881" font-size="14">If /health is unhappy,</text>
    <text x="764" y="325" fill="#4d7881" font-size="14">try the previous image.</text>
    <path d="M761 333C816 338 886 331 953 335" fill="none" stroke="#4d7881" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <path d="M1055 401C992 397 921 404 853 400" fill="none" stroke="#a2664d" stroke-width="1.4" stroke-linecap="round"/>
  <text x="1054" y="418" text-anchor="end" fill="#777e78" font-family="Segoe Print,Comic Sans MS,cursive" font-size="11">drawn for this repo · no live host configured</text>
</svg>
