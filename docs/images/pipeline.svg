<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">Hand-drawn CI/CD pipeline sketch</title>
  <desc id="desc">A notebook-style sketch showing GitHub, build, tests, optional deployment, and the EC2 host. Pull requests stop after testing; deployment is manually enabled.</desc>
  <rect width="1100" height="440" rx="4" fill="#f7f4eb"/>
  <path d="M66 0V440" stroke="#d79b91" stroke-width="1.4" opacity=".65"/>
  <g stroke="#a8bac0" stroke-width="1" opacity=".28">
    <path d="M0 115H1100M0 165H1100M0 215H1100M0 265H1100M0 315H1100M0 365H1100"/>
  </g>
  <text x="92" y="58" fill="#303a3a" font-family="Segoe Print,Comic Sans MS,cursive" font-size="27" font-weight="600">Commit to running container</text>
  <path d="M93 69C260 74 422 63 610 70" fill="none" stroke="#4d7881" stroke-width="2.5" stroke-linecap="round"/>
  <text x="94" y="95" fill="#677271" font-family="Segoe Print,Comic Sans MS,cursive" font-size="14">the plan in three small stages</text>

  <g fill="none" stroke="#384344" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
