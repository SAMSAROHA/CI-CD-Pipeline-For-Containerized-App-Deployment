    <path d="M296 140C333 142 391 138 435 140M294 223C344 222 389 226 436 224" stroke-width="1.1" opacity=".55"/>
    <path d="M490 143C491 139 497 137 505 137L629 137C637 137 640 142 639 150L640 216C639 222 635 227 627 227L501 228C494 226 489 222 490 215Z"/>
    <path d="M494 140C538 139 583 141 635 140M492 224C534 226 584 223 636 224" stroke-width="1.1" opacity=".55"/>
    <path d="M688 144C690 138 697 136 704 137L828 138C835 139 839 144 838 151L839 216C838 223 834 227 826 227L700 227C693 226 688 222 688 215Z"/>
    <path d="M693 141C733 138 783 141 834 140M691 224C735 226 786 223 835 225" stroke-width="1.1" opacity=".55"/>
    <path d="M886 144C887 138 894 137 902 137L1028 137C1035 138 1039 143 1038 151L1038 216C1037 223 1033 227 1025 227L899 227C892 227 887 223 886 216Z"/>
    <path d="M891 141C931 140 983 138 1034 140M889 224C936 224 986 226 1034 224" stroke-width="1.1" opacity=".55"/>
  </g>

  <g fill="#303a3a" font-family="Segoe Print,Comic Sans MS,cursive" text-anchor="middle">
    <text x="167" y="166" font-size="13" fill="#6a8588">START</text><text x="167" y="190" font-size="20">GitHub</text><text x="167" y="211" font-size="12">PR or main push</text>
    <text x="366" y="166" font-size="13" fill="#6a8588">01</text><text x="366" y="190" font-size="20">Build</text><text x="366" y="211" font-size="12">Docker image</text>
    <text x="565" y="166" font-size="13" fill="#6a8588">02</text><text x="565" y="190" font-size="20">Test</text><text x="565" y="211" font-size="12">pytest + smoke</text>
    <text x="763" y="166" font-size="13" fill="#a2664d">03 · OPT IN</text><text x="763" y="190" font-size="20">Deploy</text><text x="763" y="211" font-size="12">manual checkbox</text>
    <text x="962" y="166" font-size="13" fill="#6a8588">HOST</text><text x="962" y="190" font-size="20">EC2</text><text x="962" y="211" font-size="12">only when enabled</text>
  </g>

  <g fill="none" stroke="#4d7881" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 180C260 177 272 182 285 180"/><path d="M437 180C453 181 471 178 482 180"/>
