<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc">
  <title id="title">Single-host deployment and rollback sequence</title>
  <desc id="desc">The deploy job pulls a new image, captures the previous image, replaces the container, checks health, then keeps the release or attempts to restore the previous image. The first release has no rollback image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#34d399"/></marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1040" height="380" rx="26" fill="url(#bg)"/>
  <text x="46" y="56" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">One host, one release at a time</text>
  <text x="46" y="82" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="13">The deploy job only runs after image build and tests succeed.</text>
  <g filter="url(#shadow)">
    <rect x="46" y="130" width="174" height="78" rx="15" fill="#1e293b" stroke="#475569"/>
    <rect x="273" y="130" width="174" height="78" rx="15" fill="#1e293b" stroke="#475569"/>
    <rect x="500" y="130" width="174" height="78" rx="15" fill="#1e293b" stroke="#475569"/>
    <rect x="727" y="130" width="260" height="78" rx="15" fill="#1e293b" stroke="#475569"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M221 169H264"/><path d="M448 169H491"/><path d="M675 169H718"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="133" y="159" fill="#7dd3fc" font-size="12" font-weight="700">1 · FETCH</text><text x="133" y="184" fill="#f8fafc" font-size="15">Pull SHA image</text>
    <text x="360" y="159" fill="#7dd3fc" font-size="12" font-weight="700">2 · REMEMBER</text><text x="360" y="184" fill="#f8fafc" font-size="15">Capture old image ref</text>
    <text x="587" y="159" fill="#7dd3fc" font-size="12" font-weight="700">3 · REPLACE</text><text x="587" y="184" fill="#f8fafc" font-size="15">Start new container</text>
    <text x="857" y="159" fill="#7dd3fc" font-size="12" font-weight="700">4 · VERIFY</text><text x="857" y="184" fill="#f8fafc" font-size="15">Poll /health</text>
  </g>
  <path d="M856 212V248H508" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#greenArrow)"/>
  <path d="M856 212V248H907" stroke="#fb7185" stroke-width="2.5" fill="none" marker-end="url(#redArrow)"/>
  <rect x="323" y="264" width="246" height="68" rx="14" fill="#064e3b" stroke="#34d399"/>
  <rect x="727" y="264" width="260" height="68" rx="14" fill="#4c0519" stroke="#fb7185"/>
  <text x="446" y="291" fill="#a7f3d0" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">HEALTHY</text>
  <text x="446" y="314" fill="#ecfdf5" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">Keep the new release</text>
  <text x="857" y="291" fill="#fecdd3" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">UNHEALTHY</text>
  <text x="857" y="314" fill="#fff1f2" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">Attempt to restore old image</text>
  <text x="46" y="359" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="12">First release has no prior image. Rollback restores a container image only; it does not reverse data changes.</text>
</svg>
