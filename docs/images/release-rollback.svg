<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
  <title id="title">Hand-drawn deployment and rollback sketch</title>
  <desc id="desc">A notebook drawing: pull the new image, remember the old reference, start the new container and check its health. Keep a healthy release or attempt to restart the old image if it fails.</desc>
  <rect width="1000" height="370" rx="4" fill="#f7f4eb"/>
  <path d="M58 0V370" stroke="#d79b91" stroke-width="1.4" opacity=".65"/>
  <g stroke="#a8bac0" stroke-width="1" opacity=".28"><path d="M0 110H1000M0 160H1000M0 210H1000M0 260H1000M0 310H1000"/></g>
  <text x="84" y="51" fill="#303a3a" font-family="Segoe Print,Comic Sans MS,cursive" font-size="24" font-weight="600">If the new container stumbles…</text>
  <path d="M86 60C246 64 384 57 583 61" fill="none" stroke="#4d7881" stroke-width="2" stroke-linecap="round"/>
  <text x="86" y="86" fill="#777e78" font-family="Segoe Print,Comic Sans MS,cursive" font-size="13">single host · one named app container</text>

  <g fill="none" stroke="#384344" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 129C86 123 91 121 98 122L235 122C242 123 245 128 244 136L244 189C243 197 238 200 230 199L97 200C90 199 85 195 86 188Z"/>
    <path d="M284 130C284 124 290 122 297 122L435 123C442 123 445 129 444 136L444 188C443 196 439 199 431 199L295 200C288 199 283 195 284 188Z"/>
    <path d="M483 130C484 124 489 122 497 122L634 122C641 123 645 128 644 136L644 188C643 196 639 199 631 199L495 200C488 199 483 195 483 188Z"/>
    <path d="M682 130C683 124 689 122 696 122L831 123C838 124 842 128 841 136L841 188C841 196 835 199 828 199L694 200C687 199 682 195 682 188Z"/>
  </g>
  <g fill="#303a3a" font-family="Segoe Print,Comic Sans MS,cursive" text-anchor="middle">
    <text x="165" y="148" font-size="12" fill="#6a8588">A · FETCH</text><text x="165" y="173" font-size="17">Pull new SHA</text><text x="165" y="190" font-size="11">from GHCR</text>
    <text x="364" y="148" font-size="12" fill="#6a8588">B · NOTE</text><text x="364" y="173" font-size="17">Remember old</text><text x="364" y="190" font-size="11">image reference</text>
    <text x="563" y="148" font-size="12" fill="#6a8588">C · SWAP</text><text x="563" y="173" font-size="17">Start new app</text><text x="563" y="190" font-size="11">container on :80</text>
    <text x="762" y="148" font-size="12" fill="#a2664d">D · CHECK</text><text x="762" y="173" font-size="17">Ask /health</text><text x="762" y="190" font-size="11">up to 15 times</text>
  </g>
  <g fill="none" stroke="#4d7881" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 160C259 158 272 162 277 160M449 160C460 162 470 158 476 160M649 160C660 158 671 162 676 160"/>
    <path d="M270 155L279 160L270 165M469 155L478 160L469 165M669 155L678 160L669 165" stroke-width="1.6"/>
  </g>
  <path d="M761 205C761 227 710 232 643 233" fill="none" stroke="#4d7881" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M760 205C773 223 811 229 855 231" fill="none" stroke="#a2664d" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M640 228L632 233L641 237M851 226L859 231L850 236" fill="none" stroke="#a2664d" stroke-width="1.5" stroke-linecap="round"/>
  <g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M490 247C490 242 496 240 503 241L687 241C694 242 697 247 696 255L696 299C695 306 690 309 683 309L500 309C493 308 489 304 490 297Z" stroke="#4d7881"/>
    <path d="M737 247C737 242 743 240 750 241L934 241C941 242 944 247 943 255L943 299C942 306 938 309 930 309L747 309C740 308 736 304 737 297Z" stroke="#a2664d"/>
  </g>
  <g font-family="Segoe Print,Comic Sans MS,cursive" text-anchor="middle">
    <text x="593" y="269" fill="#4d7881" font-size="13">HEALTHY</text><text x="593" y="291" fill="#303a3a" font-size="15">keep the new release</text>
    <text x="840" y="269" fill="#a2664d" font-size="13">NOT HEALTHY</text><text x="840" y="291" fill="#303a3a" font-size="15">try the old image again</text>
  </g>
  <text x="85" y="345" fill="#777e78" font-family="Segoe Print,Comic Sans MS,cursive" font-size="12">First release has no old image. This does not undo data changes.</text>
  <path d="M84 351C261 355 426 349 660 352" fill="none" stroke="#a2664d" stroke-width="1.3" stroke-linecap="round"/>
</svg>
