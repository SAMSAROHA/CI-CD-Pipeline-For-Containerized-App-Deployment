name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Unit and container smoke tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull built image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker pull "${{ needs.build.outputs.image }}"
      - name: Build image for pull request smoke test
        if: github.event_name == 'pull_request'
        run: docker build --tag cicd-demo:smoke .
      - name: Start container and check health
        shell: bash
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'cicd-demo:smoke' || needs.build.outputs.image }}
        run: |
          set -euo pipefail
          docker run --detach --name smoke --publish 8080:8080 "$IMAGE"
          trap 'docker rm --force smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if response="$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/health 2>/dev/null)"; then
              if [[ "$response" == '{"status":"ok"}' ]]; then
                echo "Container health check passed"
                exit 0
              fi
              echo "Unexpected health response: $response" >&2
              docker logs smoke
              exit 1
            fi
            sleep 2
          done
          echo "Container did not become healthy" >&2
          docker logs smoke
          exit 1

  deploy:
    name: Deploy to EC2
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH with health check and rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            IMAGE='${{ needs.build.outputs.image }}'
            docker pull "$IMAGE"
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' app 2>/dev/null || true)
            docker rm --force app >/dev/null 2>&1 || true
            rollback() {
              result=$?
              if [ "$result" -ne 0 ]; then
                echo "Deployment failed; rolling back to ${PREVIOUS_IMAGE:-no previous image}" >&2
                docker rm --force app >/dev/null 2>&1 || true
                if [ -n "$PREVIOUS_IMAGE" ]; then
                  docker run --detach --name app --restart unless-stopped --publish 80:8080 "$PREVIOUS_IMAGE" || true
                fi
              fi
              exit "$result"
            }
            trap rollback EXIT

            docker run --detach --name app --restart unless-stopped --publish 80:8080 "$IMAGE"
            attempt=0
            until curl --fail --silent http://127.0.0.1/health >/dev/null; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 15 ]; then
                echo "Health check failed" >&2
                exit 1
              fi
              sleep 2
            done
            echo "Deployment healthy"
            trap - EXIT
